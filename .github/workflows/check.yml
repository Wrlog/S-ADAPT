name: Check the models

# Checks every control stream the way SADAPT-TRAN's pre-processor does,
# compiles each one with gfortran and compares it with an independent
# mrgsolve model, and runs the reference MC-PEM briefly on the template.
# S-ADAPT itself is not run here: its licence does not allow it to be
# redistributed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages("mrgsolve")'

      - name: Run the tests
        run: |
          for t in tests/*.R; do
            echo "::group::$t"
            Rscript "$t"
            echo "::endgroup::"
          done
